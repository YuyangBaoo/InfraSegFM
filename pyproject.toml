[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrasegfm"
version = "0.1.0"
description = "InfraSegFM: SAM-based infrastructure defect segmentation with hierarchical MoE adapters"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Baoxian Li"},
  {name = "Yuyang Bao"},
  {name = "Si Chen"},
  {name = "Mingwei Fang"},
  {name = "Longsheng Bao"},
  {name = "Jiakang Zhao"},
  {name = "Ling Yu"}
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "opencv-python-headless>=4.7",
  "pillow>=9.0",
  "tqdm>=4.64"
]

[tool.setuptools.packages.find]
include = ["infrasegfm*"]
